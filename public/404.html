<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var redirect = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace("/?redirect=" + redirect);
    </script>
  </head>

</html>
